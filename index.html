async function shrink(file){
  try{
    const bm=await createImageBitmap(file);const M=2000;const k=Math.min(1,M/Math.max(bm.width,bm.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);
    cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88));
    return b&&b.size?b:file
  }catch(_){return file}
}
async function uploadPhoto(f,v){
  if(!f)return;

    if(up.error)throw up.error;

    else if(a==='mrot'){if(S.mimg&&!S.aib){S.mimg=await rotateBitmap(S.mimg,+t.dataset.d);S.mrects=[];S.moval=defOval(S.mimg);S.mpoly=null;S.mdraft=null;S.mauto=1;S.mrotd=0;S.mexp=100;S.mtp=0;render();await autoFace(false)}}
    else if(a==='aisend'){
      if(S.aib)return;
      if(!S.mrects.length&&!S.aino){toast('סמני את העיניים, או סמני שאין פנים בתמונה.','err');return}
      if(!S.aic){toast('יש לאשר שהתקבל אישור הלקוחה.','err');return}
      S.aib=true;render();
      try{const c0=buildMasked();let rot=0,view='',rotated=0;
        if(S.mok&&S.mview){view=S.mview;rotated=S.mrotd||0}else try{const sp=`${S.clinic.id}/ai/${S.cur.id}/${Date.now()}_o.jpg`;const sb0=await toBlob(scaleCanvas(c0,512),.8);const u0=await sb.storage.from('case-photos').upload(sp,sb0,{contentType:'image/jpeg'});
          if(!u0.error){const o=await sb.functions.invoke('clever-endpoint',{body:{case_id:S.cur.id,path:sp,orient:true}});await rmFiles([sp]);if(o.data&&!o.data.error){rot=+o.data.rotate||0;view=o.data.view||'';rotated=rot}}}catch(_){}
        const blob=await toBlob(rot?rotateCanvas(c0,rot):c0,.85);const path=`${S.clinic.id}/ai/${S.cur.id}/${Date.now()}.jpg`;
        const up=await sb.storage.from('case-photos').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;
        const {data,error}=await sb.functions.invoke('clever-endpoint',{body:{case_id:S.cur.id,path:path,consent:true,view:view,rotated:rotated}});
        if(error){let m2=msg(error);try{const j=await error.context.json();if(j&&j.error)m2=j.error}catch(_){}await rmFiles([path]);throw new Error(m2)}
        if(data&&data.error){await rmFiles([path]);throw new Error(data.error)}
        const an=data.analysis;try{const q=await sb.storage.from('case-photos').createSignedUrls([an.photo_path],3600);if(q.data&&q.data[0])an.url=q.data[0].signedUrl}catch(_){}S.analyses.unshift(an);S.open.ai=true;S.mimg=null;if(aiViz(an.result)){openAiView(an.id)}else{S.modal=null;toast('הניתוח מוכן')}
      }catch(x){toast(msg(x),'err')}
      S.aib=false}
    else if(a==='askdelai'){S.modal={t:'confirm',title:'מחיקת ניתוח',text:'למחוק את הניתוח?',ok:'מחיקה',danger:true,act:'delai',id:t.dataset.id}}
    else if(a==='delai'){const x=S.analyses.find(z=>z.id===S.modal.id);const {error}=await sb.from('case_analyses').delete().eq('id',S.modal.id);if(error){toast(msg(error),'err');return}if(x&&x.photo_path)await rmFiles([x.photo_path]);S.analyses=S.analyses.filter(z=>z.id!==S.modal.id);S.modal=null;toast('נמחק')}
    else if(a==='rtadd'){S.modal={t:'rt'}}
    else if(a==='rtsave'){const name=($('rtn').value.trim()||($('rtp')?$('rtp').value:'')).trim();if(!name){toast('בחרי מוצר או כתבי שם.','err');return}
      const r=(S.cur.routine||[]).concat([{name:name,when:$('rtw').value,freq:$('rtf').value.trim(),note:$('rtq').value.trim()}]);
      const {error}=await sb.from('cases').update({routine:r}).eq('id',S.cur.id);if(error){toast(msg(error),'err');return}S.cur.routine=r;S.modal=null;toast('נוסף לשגרה')}
    else if(a==='rtdel'){const r=(S.cur.routine||[]).filter((x,i)=>i!==+t.dataset.i);const {error}=await sb.from('cases').update({routine:r}).eq('id',S.cur.id);if(error){toast(msg(error),'err');return}S.cur.routine=r;toast('הוסר')}
    else if(a==='askroute'){S.modal={t:'route',to:t.dataset.to}}
    else if(a==='doroute'){
      const to=S.modal.to,cl=S.clients.find(c=>c.id===S.cur.client_id);
      if(to==='brand'&&!(cl&&cl.consent_share_brand_at)){toast('אין הסכמה לשיתוף עם מדריכת מותג. סמני אותה בכרטיס הלקוחה.','err');return}
      const reason=$('mr').value,note=$('mn2').value.trim();const now=new Date().toISOString();
      const {error}=await sb.from('cases').update({routed_to:to,routed_at:now,status:'waiting_instructor'}).eq('id',S.cur.id);if(error){toast(msg(error),'err');return}
      Object.assign(S.cur,{routed_to:to,routed_at:now,status:'waiting_instructor'});
      await sb.from('case_messages').insert({case_id:S.cur.id,clinic_id:S.clinic.id,sender_kind:'system',body:'הופנה ל'+(to==='brand'?'מדריכת המותג':'מדריכת Diapeau')+' · סיבה: '+reason+(note?' · '+note:'')});
      await refreshMsgs();S.modal=null;S.scroll='bottom';toast('ההפניה נרשמה')}
    else if(a==='newitem'){S.modal={t:'item',edit:null,k:t.dataset.k||'treatment',g:t.dataset.g||'',b:t.dataset.b||''}}
    else if(a==='pickbrand'){S.modal={t:'brands'}}
    else if(a==='addbrand'){const {error}=await sb.from('clinic_brands').insert({clinic_id:S.clinic.id,brand_id:t.dataset.id});if(error){toast(msg(error),'err');return}S.modal=null;await loadCatalog();toast('היצרן נוסף והפרוטוקולים שלו הופיעו')}
    else if(a==='askdelbrand'){const b=S.brands.find(x=>x.id===t.dataset.id);S.modal={t:'confirm',title:'הסרת יצרן',text:'להסיר את "'+(b?b.name:'')+'" מהקליניקה? הפרוטוקולים הרשמיים שלו יפסיקו להופיע. הפריטים והשיטות שלך נשארים.',ok:'הסרה',danger:true,act:'delbrand',id:t.dataset.id}}
    else if(a==='delbrand'){const {error}=await sb.from('clinic_brands').delete().eq('clinic_id',S.clinic.id).eq('brand_id',S.modal.id);if(error){toast(msg(error),'err');return}S.modal=null;await loadCatalog();toast('היצרן הוסר')}
    else if(a==='protod'){S.modal={t:'protod',x:S.catProtos.find(x=>x.id===t.dataset.id)}}
    else if(a==='myprotod'){S.modal={t:'myproto',x:S.myProtos.find(x=>x.id===t.dataset.id)}}
    else if(a==='newproto'){S.modal={t:'proto',b:t.dataset.b||''}}
    else if(a==='saveproto'){const name=$('pn').value.trim();if(!name){toast('כתבי שם לשיטה.','err');return}if(!$('pok').checked){toast('יש לאשר שהשיטה באחריותך המקצועית.','err');return}
      const {data,error}=await sb.from('clinic_protocols').insert({clinic_id:S.clinic.id,brand:$('pb').value.trim()||null,name:name,steps:$('ps').value.trim()||null,notes:$('pno').value.trim()||null,created_by:S.user.id,responsibility_accepted_at:new Date().toISOString()}).select().single();
      if(error){toast(msg(error),'err');return}S.myProtos.push(data);S.modal=null;toast('השיטה נשמרה')}
    else if(a==='askdelproto'){S.modal={t:'confirm',title:'מחיקת שיטה',text:'למחוק את השיטה האישית?',ok:'מחיקה',danger:true,act:'delproto',id:t.dataset.id}}
    else if(a==='delproto'){const {error}=await sb.from('clinic_protocols').delete().eq('id',S.modal.id);if(error){toast(msg(error),'err');return}S.myProtos=S.myProtos.filter(x=>x.id!==S.modal.id);S.modal=null;toast('נמחק')}
    else if(a==='saveprof'){const row={user_id:S.user.id,clinic_id:S.clinic.id,ai_name:$('pname').value.trim()||null,ai_style:$('pstyle').value,updated_at:new Date().toISOString()};const {error}=await sb.from('therapist_profiles').upsert(row,{onConflict:'user_id'});if(error){toast(msg(error),'err');return}S.prof=row;toast('נשמר')}
    else if(a==='edititem'){S.modal={t:'item',edit:S.items.find(i=>i.id===t.dataset.id)}}
    else if(a==='quickdev'){const {data,error}=await sb.from('clinic_items').insert({clinic_id:S.clinic.id,kind:'device',name:t.dataset.n}).select().single();if(error){toast(msg(error),'err');return}S.items.push(data);toast('נוסף')}
    else if(a==='saveitem'){const name=$('inm').value.trim();if(!name){toast('כתבי שם.','err');return}
      const g=n=>[...document.querySelectorAll('input[name="'+n+'"]:checked')].map(x=>x.value);
      const row={kind:$('ik').value,name:name,brand:$('ibr').value.trim()||null,price_ils:$('ipr').value===''?null:+$('ipr').value,duration_min:+$('idu').value||null,target:g('itarget'),tags:g('itags'),safe_in_pregnancy:$('ipg').checked,notes:$('ino').value.trim()||null};
      if(S.modal.edit){const {error}=await sb.from('clinic_items').update(row).eq('id',S.modal.edit.id);if(error){toast(msg(error),'err');return}Object.assign(S.modal.edit,row)}
      else{const {data,error}=await sb.from('clinic_items').insert(Object.assign({clinic_id:S.clinic.id},row)).select().single();if(error){toast(msg(error),'err');return}S.items.push(data)}
      S.modal=null;toast('נשמר')}
    else if(a==='askdelitem'){S.modal={t:'confirm',title:'מחיקה',text:'למחוק את "'+S.modal.edit.name+'" מהרשימה?',ok:'מחיקה',danger:true,act:'delitem',id:S.modal.edit.id}}
    else if(a==='delitem'){const {error}=await sb.from('clinic_items').delete().eq('id',S.modal.id);if(error){toast(msg(error),'err');return}S.items=S.items.filter(i=>i.id!==S.modal.id);S.modal=null;toast('נמחק')}
    else if(a==='saveclinic'){const n=$('sname').value.trim();if(!n){toast('כתבי שם.','err');return}const {error}=await sb.from('clinics').update({name:n}).eq('id',S.clinic.id);if(error){toast(msg(error),'err');return}S.clinic.name=n;toast('נשמר')}
  }catch(x){toast(msg(x),'err');S.up=''}
  render()});
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.user){S.user=null;S.clinic=null;render()}});
S.ptok=(new URLSearchParams(location.search).get('p')||'').trim();
if(S.ptok){loadPortal()}else{load()}
render();
</script>
</body>
