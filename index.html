<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diapeau Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#EAEDE9;--card:#FAFAF8;--ink:#2B3230;--mute:#7A837F;--line:#DADFD9;--sd:#5F7569;--mist:#DCE4E0;--warn:#B58A6B;--wbg:#F1E8E0}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#181D1C;--card:#252B2A;--ink:#E6EAE7;--mute:#98A39E;--line:#353D3B;--sd:#A9BFB2;--mist:#2D3835;--warn:#D1A988;--wbg:#38302A}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Heebo,system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.top{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:300;letter-spacing:.18em;font-size:19px}.logo b{font-weight:600}
.body{padding:14px 12px}.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
h2{font-size:16px;font-weight:500;margin:0 0 8px}.sub{color:var(--mute);font-size:13px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0}
input[type=checkbox]{width:auto;margin:0 0 0 8px}label{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.b{background:var(--sd);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;margin:6px 0 0 6px}.b.g{background:none;color:var(--sd);border:1px solid var(--line)}
.alert{background:var(--wbg);border-inline-start:3px solid var(--warn);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.row{display:block;width:100%;text-align:start;border:0;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.tabs{position:fixed;bottom:0;inset-inline:0;max-width:620px;margin:auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;padding:9px;border-radius:10px;color:var(--mute);cursor:pointer}.tabs .on{background:var(--mist);color:var(--sd);font-weight:500}
.m{max-width:84%;margin:6px 0;padding:9px 12px;border-radius:14px;background:var(--card);width:fit-content;white-space:pre-wrap}.m.me{background:var(--mist);margin-inline-end:auto}.m.oth{margin-inline-start:auto}
.pw{display:inline-block;position:relative;margin:4px 6px 0 0;text-align:center}.pw .ph{margin:0;display:block}.del{background:none;border:0;color:var(--warn);font-size:13px;cursor:pointer;padding:2px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.chip{display:inline-flex;align-items:center;margin:0;padding:6px 10px;background:var(--bg);border:1px solid var(--line);border-radius:999px;color:var(--ink);font-size:13px}.chip input{margin:0 0 0 6px}
.ph{width:140px;height:140px;object-fit:cover;border-radius:10px;margin:4px 6px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://ipigalvzphibktlvhpcj.supabase.co';
const SB_KEY='sb_publishable_0a1V0SR38S_ZnuyLBoxNhQ_hYftLl_V';
const sb=supabase.createClient(SB_URL,SB_KEY);
const S={user:null,clinic:null,role:null,tab:'cases',clients:[],cases:[],cur:null,msgs:[],photos:[],err:'',info:'',mode:'login',busy:false,pv:'front',cl:null,q:null,qset:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VN={front:'חזית',right:'צד ימין',left:'צד שמאל',closeup:'קלוז-אפ'};
function msg(e){return e?(e.message||String(e)):''}

async function load(){
  try{
  const {data:{session}}=await sb.auth.getSession();
  S.user=session?session.user:null;
  if(!S.user){S.clinic=null;return render()}
  const {data,error}=await sb.from('members').select('role,clinic_id').limit(1);
  if(error){S.err=msg(error);return render()}
  if(!data||!data.length){S.clinic=null;return render()}
  let nm='הקליניקה שלי';
  try{const r=await sb.from('clinics').select('name').eq('id',data[0].clinic_id).maybeSingle();if(r.data&&r.data.name)nm=r.data.name}catch(_){}
  S.clinic={id:data[0].clinic_id,name:nm};S.role=data[0].role;S.err='';
  await Promise.all([loadClients(),loadCases()]);render()
  }catch(e){S.err='שגיאה בטעינה: '+msg(e);render()}
}
async function loadClients(){const {data,error}=await sb.from('clients').select('*').order('created_at',{ascending:false});if(error)S.err=msg(error);S.clients=data||[];const r=await sb.from('questionnaires').select('client_id');S.qset=(r.data||[]).map(x=>x.client_id)}
async function openClient(id){S.cl=S.clients.find(c=>c.id===id);S.err='';S.info='';const {data,error}=await sb.from('questionnaires').select('*').eq('client_id',id).maybeSingle();if(error)S.err=msg(error);S.q=data?Object.assign({},data.data,{pw:data.pregnancy_week}):null;render()}
async function loadCases(){const {data,error}=await sb.from('cases').select('*,clients(full_name)').order('created_at',{ascending:false});if(error)S.err=msg(error);S.cases=data||[]}
async function openCase(id){
  S.cur=S.cases.find(c=>c.id===id);S.err='';
  const [m,p]=await Promise.all([sb.from('case_messages').select('*').eq('case_id',id).order('created_at'),sb.from('case_photos').select('*').eq('case_id',id).order('created_at')]);
  S.msgs=m.data||[];S.photos=p.data||[];
  if(S.photos.length){const {data}=await sb.storage.from('case-photos').createSignedUrls(S.photos.map(x=>x.storage_path),3600);(data||[]).forEach((u,i)=>{S.photos[i].url=u.signedUrl})}
  render()
}

const OPT=(arr,sel)=>arr.map(([v,l])=>`<option value="${v}"${sel===v?' selected':''}>${l}</option>`).join('');
const CHK=(g,arr,sel)=>`<div class="chips">${arr.map(([v,l])=>`<label class="chip"><input type="checkbox" name="${g}" value="${v}"${(sel||[]).includes(v)?' checked':''}>${l}</label>`).join('')}</div>`;
const L_FITZ=[['','בחרי'],['1','1 · בהיר מאוד, נשרף תמיד'],['2','2 · בהיר, נשרף בקלות'],['3','3 · בינוני, לפעמים נשרף'],['4','4 · זית, נשרף מעט'],['5','5 · חום, כמעט לא נשרף'],['6','6 · כהה מאוד']];
const L_SKIN=[['','בחרי'],['normal','רגיל'],['dry','יבש'],['oily','שמן'],['combo','מעורב'],['sensitive','רגיש']];
const L_PREG=[['none','לא'],['pregnant','בהיריון'],['nursing','מניקה'],['planning','מתכננת היריון']];
const L_COND=[['diabetes','סוכרת'],['thyroid','בלוטת התריס'],['pcos','שחלות פוליציסטיות'],['autoimmune','מחלה אוטואימונית'],['eczema','אקזמה / פסוריאזיס'],['herpes','הרפס חוזר'],['keloid','נטייה לצלקות מעובות'],['blood','הפרעת קרישה'],['cardio','לב / לחץ דם'],['cancer','מחלה ממאירה'],['none','ללא מחלות רקע']];
const L_MEDS=[['isotretinoin','איזוטרטינואין (ב-6 חודשים האחרונים)'],['antibiotics','אנטיביוטיקה'],['anticoag','מדללי דם'],['hormonal','גלולות / טיפול הורמונלי'],['photo','תרופות המגבירות רגישות לשמש'],['immuno','סטרואידים / מדכאי חיסון'],['none','ללא תרופות קבועות']];
const L_ACT=[['retinoid','רטינואידים / רטינול'],['aha','חומצות AHA'],['bha','חומצה סליצילית BHA'],['vitc','ויטמין C'],['bpo','בנזואיל פרוקסיד'],['azelaic','חומצה אזלאית'],['none','ללא אקטיבים']];
const L_SENS=[['burning','צריבה'],['stinging','עקצוץ'],['tight','מתיחות / יובש'],['itch','גרד'],['redness','אדמומיות מתמשכת'],['peeling','קילוף'],['none','ללא תחושות חריגות']];
const L_PREV=[['laser','לייזר'],['peel','פילינג'],['filler','בוטוקס / חומרי מילוי'],['needling','מיקרונידלינג'],['none','ללא טיפולים']];
const L_MOIST=[['','בחרי'],['none','ללא קרם לחות'],['light','קליל / ג׳ל'],['rich','עשיר']];
const L_SPF=[['','בחרי'],['daily','כל יום'],['sometimes','לפעמים'],['never','כמעט אף פעם']];
function flags(d,c){const f=[];if(!d||!Object.keys(d).length){f.push('השאלון עדיין לא מולא. מומלץ להשלים לפני ניתוח.');}else{
  if(d.preg&&d.preg!=='none')f.push('היריון / הנקה / תכנון היריון: נדרשת בדיקה אנושית, מומלץ לשקול הפניה למדריכה.');
  if((d.meds||[]).includes('isotretinoin'))f.push('איזוטרטינואין: נדרשת זהירות בטיפולים חודרניים, מומלץ לשקול הפניה למדריכה.');
  if((d.meds||[]).includes('photo'))f.push('תרופות המגבירות רגישות לשמש.');
  if((d.meds||[]).includes('anticoag'))f.push('מדללי דם.');
  if((d.cond||[]).includes('herpes'))f.push('היסטוריה של הרפס: לבדוק לפני טיפולים באזור הפה.');
  if((d.cond||[]).includes('keloid'))f.push('נטייה לצלקות מעובות.');
  if((d.cond||[]).includes('cancer'))f.push('מחלה ממאירה: נדרשת בדיקה אנושית.');
  if(['4','5','6'].includes(d.fitz))f.push('סוג עור 4 ומעלה: זהירות מפיגמנטציה לאחר דלקת.');}
  if(c&&!c.consent_photos_at)f.push('אין אישור צילום ללקוחה.');return f}
function vClient(){const c=S.cl,d=S.q||{};const fl=flags(S.q,c);
  return `<div class="top"><button class="b g" style="margin:0" data-a="back">→</button><b>${esc(c.full_name)}</b></div><div class="body">${S.err?`<div class="alert">${esc(S.err)}</div>`:''}${S.info?`<div class="alert" style="background:var(--mist);border-color:var(--sd)">${esc(S.info)}</div>`:''}${fl.map(x=>`<div class="alert">⚑ ${esc(x)}</div>`).join('')}<div class="card"><h2>שאלון בריאות והיסטוריה רפואית</h2><p class="sub">ההערות למעלה הן סימוני עזר בלבד. ההחלטה תמיד של המטפלת.</p>
<label>סוג עור לפי פיצפטריק</label><select id="qf">${OPT(L_FITZ,d.fitz||'')}</select>
<label>סוג עור</label><select id="qs">${OPT(L_SKIN,d.skin||'')}</select>
<label>היריון / הנקה</label><select id="qp">${OPT(L_PREG,d.preg||'none')}</select>
<label>שבוע היריון (אם רלוונטי)</label><input id="qw" type="number" min="0" max="45" value="${esc(d.pw||'')}">
<label>מחלות רקע</label>${CHK('cond',L_COND,d.cond)}
<label>תרופות</label>${CHK('meds',L_MEDS,d.meds)}
<label>אלרגיות (טקסט חופשי)</label><input id="qal" value="${esc(d.allergy||'')}">
<label>אקטיבים בשימוש כיום</label>${CHK('actives',L_ACT,d.actives)}
<label>קרם לחות</label><select id="qm">${OPT(L_MOIST,d.moist||'')}</select>
<label>קרם הגנה</label><select id="qspf">${OPT(L_SPF,d.spf||'')}</select>
<label>תחושות בעור</label>${CHK('sens',L_SENS,d.sens)}
<label>טיפולים ב-3 החודשים האחרונים</label>${CHK('prev',L_PREV,d.prev)}
<label>מטרת הלקוחה</label><input id="qg" value="${esc(d.goal||'')}">
<label>הערות</label><textarea id="qn" rows="3">${esc(d.notes||'')}</textarea>
<button class="b" data-a="saveq">שמירת שאלון</button></div></div>`}
function vAuth(){const si=S.mode==='login';
  return `<div class="body" style="max-width:380px;margin:8vh auto"><div class="logo" style="text-align:center;margin-bottom:18px"><b>DIA</b>PEAU</div><div class="card"><h2>${si?'כניסה':'הרשמה'}</h2><label>אימייל</label><input id="em" type="email" autocomplete="email"><label>סיסמה (לפחות 8 תווים)</label><input id="pw" type="password" autocomplete="${si?'current-password':'new-password'}">${S.err?`<div class="alert">${esc(S.err)}</div>`:''}${S.info?`<div class="alert" style="background:var(--mist);border-color:var(--sd)">${esc(S.info)}</div>`:''}<button class="b" data-a="${si?'login':'signup'}">${si?'כניסה':'יצירת חשבון'}</button><button class="b g" data-a="mode">${si?'אין לי חשבון':'כבר יש לי חשבון'}</button></div></div>`}
function vOnb(){return `<div class="body" style="max-width:420px;margin:8vh auto"><div class="card"><h2>הקמת קליניקה</h2><p class="sub">נשלים את ההקמה פעם אחת. את תהיי בעלת הקליניקה.</p><label>שם הקליניקה</label><input id="cn">${S.err?`<div class="alert">${esc(S.err)}</div>`:''}<button class="b" data-a="mkclinic">יצירה</button><button class="b g" data-a="logout">יציאה</button></div></div>`}
function vTop(t){return `<div class="top"><div class="logo"><b>DIA</b>PEAU</div><span class="sub" style="margin-inline-start:auto">${esc(S.clinic.name)}</span><button class="b g" style="margin:0" data-a="logout">יציאה</button></div>`}
function vClients(){return `<div class="body">${S.err?`<div class="alert">${esc(S.err)}</div>`:''}<div class="card"><h2>לקוחה חדשה</h2><label>שם מלא</label><input id="cnm"><label>שנת לידה</label><input id="cby" type="number" min="1900" max="2100"><label>תקציב בש״ח (ריק או 0 = ללא הגבלה)</label><input id="cbd" type="number" min="0"><label style="display:flex;align-items:center"><input id="ccs" type="checkbox">הלקוחה אישרה אחסון תמונות</label><button class="b" data-a="addclient">הוספה</button></div>${S.clients.map(c=>`<button class="row" data-a="oclient" data-id="${c.id}"><b>${esc(c.full_name)}</b><br><span class="sub">${c.birth_year?'נולדה '+esc(c.birth_year)+' · ':''}${c.consent_photos_at?'אישרה צילום':'ללא אישור צילום'} · ${S.qset.includes(c.id)?'שאלון מולא':'חסר שאלון'}</span></button>`).join('')||'<p class="sub">אין לקוחות עדיין.</p>'}</div>`}
function vCases(){return `<div class="body">${S.err?`<div class="alert">${esc(S.err)}</div>`:''}<div class="card"><h2>מקרה חדש</h2><label>לקוחה</label><select id="ncl">${S.clients.map(c=>`<option value="${c.id}">${esc(c.full_name)}</option>`).join('')}</select><label>השאלה</label><textarea id="nq" rows="2"></textarea><button class="b" data-a="addcase"${S.clients.length?'':' disabled'}>פתיחת מקרה</button>${S.clients.length?'':'<p class="sub">הוסיפי קודם לקוחה בלשונית לקוחות.</p>'}</div>${S.cases.map(c=>`<button class="row" data-a="open" data-id="${c.id}"><b>${esc(c.clients?c.clients.full_name:'')}</b><br><span class="sub">${esc(c.question||'מקרה')}</span></button>`).join('')}</div>`}
function vCase(){const c=S.cur;return `<div class="top"><button class="b g" style="margin:0" data-a="back">→</button><b>${esc(c.clients?c.clients.full_name:'')}</b></div><div class="body">${S.err?`<div class="alert">${esc(S.err)}</div>`:''}<div class="card"><h2>תמונות</h2>${S.photos.map(p=>`<span class="pw"><span class="sub">${VN[p.view]||''}</span><img class="ph" src="${esc(p.url||'')}" alt="תמונת לקוחה"><button class="del" data-a="delphoto" data-id="${p.id}">🗑 מחיקה</button></span>`).join('')||'<p class="sub">אין תמונות.</p>'}<br><select id="pv">${Object.keys(VN).map(k=>`<option value="${k}"${S.pv===k?' selected':''}>${VN[k]}</option>`).join('')}</select><input id="pf" type="file" accept="image/jpeg,image/png,image/webp"><button class="b" data-a="upload"${S.busy?' disabled':''}>${S.busy?'מעלה...':'העלאת תמונה'}</button></div><div class="card"><h2>שיחה</h2>${S.msgs.map(m=>`<div class="m ${m.sender_kind==='therapist'?'me':'oth'}">${esc(m.body)}</div>`).join('')||'<p class="sub">אין הודעות.</p>'}<textarea id="mt" rows="2" placeholder="כתבי הודעה"></textarea><button class="b" data-a="send">שליחה</button></div></div>`}
function render(){
  let h;
  if(!S.user)h=vAuth();else if(!S.clinic)h=vOnb();
  else if(S.cur)h=vCase();
  else if(S.cl)h=vClient();
  else h=vTop()+(S.tab==='clients'?vClients():vCases())+`<div class="tabs"><button class="${S.tab==='cases'?'on':''}" data-a="tab" data-t="cases">מקרים</button><button class="${S.tab==='clients'?'on':''}" data-a="tab" data-t="clients">לקוחות</button></div>`;
  $('app').innerHTML=h}

document.addEventListener('change',e=>{if(e.target&&e.target.id==='pv')S.pv=e.target.value});
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;S.err='';S.info='';
  try{
    if(a==='mode'){S.mode=S.mode==='login'?'signup':'login';S.info=''}
    else if(a==='login'){const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)S.err='הכניסה נכשלה: '+msg(error);else return load()}
    else if(a==='signup'){const {data,error}=await sb.auth.signUp({email:$('em').value.trim(),password:$('pw').value});if(error)S.err=msg(error);else if(!data.session){S.info='נשלח אליך מייל לאישור. אחרי האישור, חזרי וכנסי.';S.mode='login'}else return load()}
    else if(a==='logout'){await sb.auth.signOut();S.cur=null;S.clinic=null;S.user=null}
    else if(a==='mkclinic'){const n=$('cn').value.trim();if(!n)S.err='כתבי שם לקליניקה.';else{const {error}=await sb.rpc('create_clinic',{clinic_name:n});if(error){S.err=msg(error);if(/already in a clinic/.test(S.err)){S.err='';return load()}}else return load()}}
    else if(a==='tab'){S.tab=t.dataset.t}
    else if(a==='addclient'){const n=$('cnm').value.trim();if(!n)S.err='כתבי שם.';else{const {error}=await sb.from('clients').insert({clinic_id:S.clinic.id,full_name:n,birth_year:+$('cby').value||null,budget_ils:+$('cbd').value||null,consent_photos_at:$('ccs').checked?new Date().toISOString():null});if(error)S.err=msg(error);else await loadClients()}}
    else if(a==='addcase'){const q=$('nq').value.trim(),cid=$('ncl').value;const {data,error}=await sb.from('cases').insert({clinic_id:S.clinic.id,client_id:cid,question:q||null,created_by:S.user.id}).select().single();if(error)S.err=msg(error);else{if(q)await sb.from('case_messages').insert({case_id:data.id,clinic_id:S.clinic.id,sender_kind:'therapist',sender_id:S.user.id,body:q});await loadCases();return openCase(data.id)}}
    else if(a==='delphoto'){const ph=S.photos.find(x=>x.id===t.dataset.id);if(ph&&confirm('למחוק את התמונה?')){const r1=await sb.from('case_photos').delete().eq('id',ph.id);if(r1.error)S.err=msg(r1.error);else{await sb.storage.from('case-photos').remove([ph.storage_path]);return openCase(S.cur.id)}}}
    else if(a==='open')return openCase(t.dataset.id);
    else if(a==='back'){S.cur=null;S.cl=null;await loadCases()}
    else if(a==='oclient')return openClient(t.dataset.id);
    else if(a==='saveq'){const g=n=>[...document.querySelectorAll('input[name="'+n+'"]:checked')].map(x=>x.value);const v=id=>$(id).value;const data={fitz:v('qf'),skin:v('qs'),preg:v('qp'),cond:g('cond'),meds:g('meds'),actives:g('actives'),sens:g('sens'),prev:g('prev'),moist:v('qm'),spf:v('qspf'),allergy:v('qal').trim(),goal:v('qg').trim(),notes:v('qn').trim()};const wk=data.preg==='pregnant'?(+v('qw')||0):0;const {error}=await sb.from('questionnaires').upsert({client_id:S.cl.id,clinic_id:S.clinic.id,data:data,pregnancy_week:wk,updated_at:new Date().toISOString()},{onConflict:'client_id'});if(error)S.err=msg(error);else{S.q=Object.assign({},data,{pw:wk});if(!S.qset.includes(S.cl.id))S.qset.push(S.cl.id);S.info='השאלון נשמר.'}}
    else if(a==='send'){const b=$('mt').value.trim();if(b){const {error}=await sb.from('case_messages').insert({case_id:S.cur.id,clinic_id:S.clinic.id,sender_kind:'therapist',sender_id:S.user.id,body:b});if(error)S.err=msg(error);else return openCase(S.cur.id)}}
    else if(a==='upload'){const f=$('pf').files[0];if(!f)S.err='בחרי תמונה.';
      else if(!['image/jpeg','image/png','image/webp'].includes(f.type))S.err='אפשר להעלות רק JPG, PNG או WEBP.';
      else if(f.size>10*1024*1024)S.err='התמונה גדולה מ-10MB.';
      else{const cl=S.clients.find(c=>c.id===S.cur.client_id);
        if(!cl||!cl.consent_photos_at)S.err='אין אישור צילום ללקוחה. סמני אישור בכרטיס הלקוחה לפני העלאה.';
        else{S.busy=true;render();const v=$('pv')?$('pv').value:'front';const path=`${S.clinic.id}/${S.cur.id}/${Date.now()}-${v}`;
          const up=await sb.storage.from('case-photos').upload(path,f,{contentType:f.type});
          if(up.error)S.err=msg(up.error);else{const {error}=await sb.from('case_photos').insert({case_id:S.cur.id,clinic_id:S.clinic.id,view:v,source:'phone',storage_path:path});if(error)S.err=msg(error)}
          S.busy=false;if(!S.err){const order=Object.keys(VN);const used=S.photos.map(x=>x.view).concat([v]);S.pv=order.find(k=>!used.includes(k))||v;return openCase(S.cur.id)}}}}
  }catch(x){S.err=msg(x);S.busy=false}
  render()});
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')load()});
load();
</script>
