    try{const r=await sb.from('clinics').select('name').eq('id',data[0].clinic_id).maybeSingle();if(r.data&&r.data.name)nm=r.data.name}catch(_){}
    S.clinic={id:data[0].clinic_id,name:nm};S.role=data[0].role;S.errBox='';
    await loadAll();S.loading=false;render()
  }catch(e){S.loading=false;S.errBox='שגיאה בטעינה: '+msg(e);render()}
}
async function openCase(id,keep){
  const c=S.cases.find(x=>x.id===id);if(!c)return;S.cur=c;
  const [m,p]=await Promise.all([sb.from('case_messages').select('*').eq('case_id',id).order('created_at'),sb.from('case_photos').select('*').eq('case_id',id).order('created_at')]);
  S.msgs=m.data||[];S.photos=p.data||[];
  if(S.photos.length){const {data}=await sb.storage.from('case-photos').createSignedUrls(S.photos.map(x=>x.storage_path),3600);(data||[]).forEach((u,i)=>{if(S.photos[i])S.photos[i].url=u.signedUrl})}
  if(!keep)S.draft='';

async function rmFiles(paths){if(paths.length)await sb.storage.from('case-photos').remove(paths)}
async function shrink(file){
  try{
    const bm=await createImageBitmap(file);const M=2000;const k=Math.min(1,M/Math.max(bm.width,bm.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);
    cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88));
    return b&&b.size?b:file
  }catch(_){return file}
}
async function uploadPhoto(f,v){
  if(!f)return;
  const cl=S.clients.find(c=>c.id===S.cur.client_id);
  if(!cl||!cl.consent_photos_at){toast('אין אישור צילום ללקוחה. סמני אישור לפני העלאה.','err');return}
  S.up=v;render();
  try{
    const blob=await shrink(f);
    const ok=['image/jpeg','image/png','image/webp'];
    if(!ok.includes(blob.type)){toast('אפשר להעלות רק JPG, PNG או WEBP.','err');S.up='';render();return}
    if(blob.size>10*1024*1024){toast('התמונה גדולה מ-10MB.','err');S.up='';render();return}
    const path=`${S.clinic.id}/${S.cur.id}/${Date.now()}-${v}`;
    const up=await sb.storage.from('case-photos').upload(path,blob,{contentType:blob.type});
    if(up.error)throw up.error;
    const ins=await sb.from('case_photos').insert({case_id:S.cur.id,clinic_id:S.clinic.id,view:v,source:'phone',storage_path:path});
    if(ins.error)throw ins.error;
    S.up='';await openCase(S.cur.id,true);toast('התמונה נשמרה')
  }catch(e){S.up='';toast(msg(e),'err');render()}
}

      const {error}=await sb.from('cases').update({routed_to:to,routed_at:now,status:'waiting_instructor'}).eq('id',S.cur.id);if(error){toast(msg(error),'err');return}
      Object.assign(S.cur,{routed_to:to,routed_at:now,status:'waiting_instructor'});
      await sb.from('case_messages').insert({case_id:S.cur.id,clinic_id:S.clinic.id,sender_kind:'system',body:'הופנה ל'+(to==='brand'?'מדריכת המותג':'מדריכת Diapeau')+' · סיבה: '+reason+(note?' · '+note:'')});
      await refreshMsgs();S.modal=null;S.scroll='bottom';toast('ההפניה נרשמה')}
    else if(a==='newitem'){S.modal={t:'item',edit:null,k:t.dataset.k||'treatment',g:t.dataset.g||''}}
    else if(a==='edititem'){S.modal={t:'item',edit:S.items.find(i=>i.id===t.dataset.id)}}
    else if(a==='quickdev'){const {data,error}=await sb.from('clinic_items').insert({clinic_id:S.clinic.id,kind:'device',name:t.dataset.n}).select().single();if(error){toast(msg(error),'err');return}S.items.push(data);toast('נוסף')}
    else if(a==='saveitem'){const name=$('inm').value.trim();if(!name){toast('כתבי שם.','err');return}
      const g=n=>[...document.querySelectorAll('input[name="'+n+'"]:checked')].map(x=>x.value);
      const row={kind:$('ik').value,name:name,brand:$('ibr').value.trim()||null,price_ils:$('ipr').value===''?null:+$('ipr').value,duration_min:+$('idu').value||null,target:g('itarget'),tags:g('itags'),safe_in_pregnancy:$('ipg').checked,notes:$('ino').value.trim()||null};
      if(S.modal.edit){const {error}=await sb.from('clinic_items').update(row).eq('id',S.modal.edit.id);if(error){toast(msg(error),'err');return}Object.assign(S.modal.edit,row)}
      else{const {data,error}=await sb.from('clinic_items').insert(Object.assign({clinic_id:S.clinic.id},row)).select().single();if(error){toast(msg(error),'err');return}S.items.push(data)}
      S.modal=null;toast('נשמר')}
    else if(a==='askdelitem'){S.modal={t:'confirm',title:'מחיקה',text:'למחוק את "'+S.modal.edit.name+'" מהרשימה?',ok:'מחיקה',danger:true,act:'delitem',id:S.modal.edit.id}}
    else if(a==='delitem'){const {error}=await sb.from('clinic_items').delete().eq('id',S.modal.id);if(error){toast(msg(error),'err');return}S.items=S.items.filter(i=>i.id!==S.modal.id);S.modal=null;toast('נמחק')}
    else if(a==='saveclinic'){const n=$('sname').value.trim();if(!n){toast('כתבי שם.','err');return}const {error}=await sb.from('clinics').update({name:n}).eq('id',S.clinic.id);if(error){toast(msg(error),'err');return}S.clinic.name=n;toast('נשמר')}
  }catch(x){toast(msg(x),'err');S.up=''}
  render()});
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.user){S.user=null;S.clinic=null;render()}});
render();load();
</script>
</body>
</html>
