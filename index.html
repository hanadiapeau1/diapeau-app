<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diapeau Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#EAEDE9;--card:#FAFAF8;--ink:#2B3230;--mute:#7A837F;--line:#DADFD9;--sd:#5F7569;--mist:#DCE4E0;--warn:#B58A6B;--wbg:#F1E8E0}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#181D1C;--card:#252B2A;--ink:#E6EAE7;--mute:#98A39E;--line:#353D3B;--sd:#A9BFB2;--mist:#2D3835;--warn:#D1A988;--wbg:#38302A}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Heebo,system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.top{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:300;letter-spacing:.18em;font-size:19px}.logo b{font-weight:600}
.body{padding:14px 12px}.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
h2{font-size:16px;font-weight:500;margin:0 0 8px}.sub{color:var(--mute);font-size:13px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0}
input[type=checkbox]{width:auto;margin:0 0 0 8px}label{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.b{background:var(--sd);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;margin:6px 0 0 6px}.b.g{background:none;color:var(--sd);border:1px solid var(--line)}
.alert{background:var(--wbg);border-inline-start:3px solid var(--warn);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.row{display:block;width:100%;text-align:start;border:0;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.tabs{position:fixed;bottom:0;inset-inline:0;max-width:620px;margin:auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;padding:9px;border-radius:10px;color:var(--mute);cursor:pointer}.tabs .on{background:var(--mist);color:var(--sd);font-weight:500}
.m{max-width:84%;margin:6px 0;padding:9px 12px;border-radius:14px;background:var(--card);width:fit-content;white-space:pre-wrap}.m.me{background:var(--mist);margin-inline-end:auto}.m.oth{margin-inline-start:auto}
.ph{width:140px;height:140px;object-fit:cover;border-radius:10px;margin:4px 6px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://ipigalvzphibktlvhpcj.supabase.co';
const SB_KEY='sb_publishable_0a1V0SR38S_ZnuyLBoxNhQ_hYftLl_V';
const sb=supabase.createClient(SB_URL,SB_KEY);
const S={user:null,clinic:null,role:null,tab:'cases',clients:[],cases:[],cur:null,msgs:[],photos:[],err:'',info:'',mode:'login',busy:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VN={front:'חזית',right:'צד ימין',left:'צד שמאל',closeup:'קלוז-אפ'};
function msg(e){return e?(e.message||String(e)):''}

async function load(){
  try{
  const {data:{session}}=await sb.auth.getSession();
  S.user=session?session.user:null;
  if(!S.user){S.clinic=null;return render()}
  const {data,error}=await sb.from('members').select('role,clinic_id').limit(1);
  if(error){S.err=msg(error);return render()}
  if(!data||!data.length){S.clinic=null;return render()}
  let nm='הקליניקה שלי';
  try{const r=await sb.from('clinics').select('name').eq('id',data[0].clinic_id).maybeSingle();if(r.data&&r.data.name)nm=r.data.name}catch(_){}
  S.clinic={id:data[0].clinic_id,name:nm};S.role=data[0].role;S.err='';
  await Promise.all([loadClients(),loadCases()]);render()
  }catch(e){S.err='שגיאה בטעינה: '+msg(e);render()}
}
async function loadClients(){const {data,error}=await sb.from('clients').select('*').order('created_at',{ascending:false});if(error)S.err=msg(error);S.clients=data||[]}
async function loadCases(){const {data,error}=await sb.from('cases').select('*,clients(full_name)').order('created_at',{ascending:false});if(error)S.err=msg(error);S.cases=data||[]}
async function openCase(id){
  S.cur=S.cases.find(c=>c.id===id);S.err='';
  const [m,p]=await Promise.all([sb.from('case_messages').select('*').eq('case_id',id).order('created_at'),sb.from('case_photos').select('*').eq('case_id',id).order('created_at')]);
  S.msgs=m.data||[];S.photos=p.data||[];
  if(S.photos.length){const {data}=await sb.storage.from('case-photos').createSignedUrls(S.photos.map(x=>x.storage_path),3600);(data||[]).forEach((u,i)=>{S.photos[i].url=u.signedUrl})}
  render()
}

function vAuth(){const si=S.mode==='login';
  return `<div class="body" style="max-width:380px;margin:8vh auto"><div class="logo" style="text-align:center;margin-bottom:18px"><b>DIA</b>PEAU</div><div class="card"><h2>${si?'כניסה':'הרשמה'}</h2><label>אימייל</label><input id="em" type="email" autocomplete="email"><label>סיסמה (לפחות 8 תווים)</label><input id="pw" type="password" autocomplete="${si?'current-password':'new-password'}">${S.err?`<div class="alert">${esc(S.err)}</div>`:''}${S.info?`<div class="alert" style="background:var(--mist);border-color:var(--sd)">${esc(S.info)}</div>`:''}<button class="b" data-a="${si?'login':'signup'}">${si?'כניסה':'יצירת חשבון'}</button><button class="b g" data-a="mode">${si?'אין לי חשבון':'כבר יש לי חשבון'}</button></div></div>`}
function vOnb(){return `<div class="body" style="max-width:420px;margin:8vh auto"><div class="card"><h2>הקמת קליניקה</h2><p class="sub">נשלים את ההקמה פעם אחת. את תהיי בעלת הקליניקה.</p><label>שם הקליניקה</label><input id="cn">${S.err?`<div class="alert">${esc(S.err)}</div>`:''}<button class="b" data-a="mkclinic">יצירה</button><button class="b g" data-a="logout">יציאה</button></div></div>`}
function vTop(t){return `<div class="top"><div class="logo"><b>DIA</b>PEAU</div><span class="sub" style="margin-inline-start:auto">${esc(S.clinic.name)}</span><button class="b g" style="margin:0" data-a="logout">יציאה</button>
